# Pre-commit hooks for ESPHome user-config repository.
#
# Install with:
#   pip install pre-commit yamllint esphome
#   pre-commit install
#
# Run manually:
#   pre-commit run --all-files
#
# The `esphome-config` hook validates every example file in example_code/
# against the ESPHome schema; this is the authoritative check.
#
# On push, two more hooks mirror .github/workflows/ci.yml: the engine unit
# test and `esphome config` over all example configs, each only when the push
# changes a file it reads. ESPHome comes into a hook environment of its own,
# installed on first use, so it does not have to be on PATH.
default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: \.md$
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-yaml
        args: [--allow-multiple-documents, --unsafe]
        # --unsafe needed because ESPHome uses custom YAML tags
        # (!include, !lambda, !secret) that PyYAML can't construct.

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: [-c, .yamllint]

  - repo: local
    hooks:
      - id: esphome-config
        name: esphome config (validate example_code)
        # Symlink each changed example into the parent dir (so its
        # `esphome-modular-lvgl-buttons/...` !includes resolve), validate,
        # then clean up.
        entry: |
          bash -c '
            set -e
            repo="$(pwd)"
            parent="$(dirname "$repo")"
            for f in "$@"; do
              base="$(basename "$f")"
              link="$parent/$base"
              if [ -e "$link" ] && [ ! -L "$link" ]; then
                echo "Skipping $base (real file in $parent)"; continue
              fi
              ln -sfn "$repo/$f" "$link"
              status=0
              ( cd "$parent" && esphome config "$base" >/dev/null ) || status=$?
              rm -f "$link"
              if [ "$status" -ne 0 ]; then exit "$status"; fi
            done
          ' --
        language: python
        additional_dependencies: ["esphome==2026.10.2"]
        files: ^example_code/.*\.yaml$
        pass_filenames: true

      - id: unit-tests
        name: engine unit test
        entry: bash testing/unit_tests.sh
        language: system
        files: ^ui/clawdmeter/.*\.(h|cpp)$
        pass_filenames: false
        stages: [pre-push]

      - id: validate-configs
        name: esphome config over all example configs
        entry: bash testing/validate_examples.sh
        language: python
        additional_dependencies: ["esphome==2026.10.2"]
        files: \.ya?ml$
        pass_filenames: false
        require_serial: true
        stages: [pre-push]

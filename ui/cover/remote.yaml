---
# Remote cover tile — controls a Home Assistant cover entity (rolling
# shutter, garage door, gate, ...).
#
# "Statefull" vs "stateless" is auto-detected from the entity's
# `supported_features` bitmask (bit 4 = SET_POSITION). Statefull covers get
# a live position readout + slider on the detail page; stateless covers
# (e.g. RF-bridged shutters exposed as a `cover.template` with
# assumed_state: true) just get up/stop/down.
#
# Up/stop/down always drive the main `cover.*` entity_id via the standard
# cover.open_cover/close_cover/stop_cover services — this matches covers
# built from cover.template + assumed_state, which still expose a normal
# cover.* entity in HA even though the backend has no real position feedback.
#
# Short-click opens the detail page (up / stop / down / optional my-position).
#
# vars:
#   uid:                unique identifier
#   entity_id:          HA cover entity, e.g. "cover.living_room_shutter"
#   row, column:        grid placement
#   text:               tile label
#   icon:               icon glyph (e.g. $mdi_window_shutter)
#   row_span, column_span: (default 1)
#   page_id:            parent page (default main_page)
#   my_position_target: optional HA entity (script/scene/button/...) for the
#                        "my position" preset. Omit to hide the button.
#   invert_position:    optional, "true" if this entity's current_position
#                        attribute reports 100=closed/0=open instead of HA's
#                        standard 0=closed/100=open. Some cover integrations
#                        don't follow the standard. Default "false".

packages:
  ${uid}_detail: !include
    file: detail.yaml
    vars:
      uid: ${uid}
      text: ${text}
      page_id: ${page_id | default("main_page")}
      has_my: '${"true" if my_position_target | default(entity_id) != entity_id else "false"}'

lvgl:
  pages:
  - id: !extend ${page_id | default("main_page")}
    widgets:
    - container:
        id: ${uid}_tile
        grid_cell_row_pos: ${row}
        grid_cell_column_pos: ${column}
        grid_cell_row_span: ${row_span | default(1)}
        grid_cell_column_span: ${column_span | default(1)}
        grid_cell_x_align: stretch
        grid_cell_y_align: stretch
        widgets:
        - button:
            id: button_${uid}
            widgets:
            - label:
                id: icon_${uid}
                text_font: $icon_font
                align: top_left
                text: ${icon}
            - label:
                id: label_${uid}
                align: bottom_left
                long_mode: wrap
                width: 100%
                text: ${text}
            - label:
                id: state_${uid}
                align: top_right
                text_font: $text_font
                text_color: $label_on_color
                text: "--"
            on_short_click:
              then:
              - lvgl.page.show:
                  id: ${uid}_cover_page
                  animation: MOVE_LEFT
                  time: 300ms

# ── HA state sensors ──────────────────────────────────────────────────────────

text_sensor:
# Domain state: open / opening / closing / closed
- platform: homeassistant
  id: ${uid}_ha_state
  entity_id: ${entity_id}
  internal: true
  on_value:
  - lambda: |-
      if      (x == "opening") id(${uid}_operation) = 1;
      else if (x == "closing") id(${uid}_operation) = 2;
      else                     id(${uid}_operation) = 0;
      // Only approximate position from the coarse open/closed state on
      // stateless covers. Statefull covers get their position exclusively
      // from ${uid}_ha_position (current_position attribute) below —
      // otherwise this would stomp the real position with 100/0 every
      // time the domain state flips to "opening"/"closed" mid-transit.
      if (!id(${uid}_is_statefull)) {
        if      (x == "open" || x == "opening") id(${uid}_current_position) = 100.0f;
        else if (x == "closed")                 id(${uid}_current_position) = 0.0f;
      }
  - script.execute: ${uid}_update_visibility
  - script.execute: ${uid}_sync_state

# supported_features bitmask — bit 4 (SET_POSITION) decides statefull vs stateless.
- platform: homeassistant
  id: ${uid}_ha_features
  entity_id: ${entity_id}
  attribute: supported_features
  internal: true
  on_value:
  - if:
      condition:
        lambda: 'return !x.empty() && x != "None";'
      then:
      - lambda: 'id(${uid}_is_statefull) = (atoi(x.c_str()) & 4) != 0;'
      - script.execute: ${uid}_update_visibility
      - script.execute: ${uid}_sync_state

sensor:
# Precise position — only present on statefull covers. Normalized to our
# internal 0=closed/100=open convention right here at ingest, so every
# consumer downstream (tile coloring, slider) never has to think about
# invert_position again.
- platform: homeassistant
  id: ${uid}_ha_position
  entity_id: ${entity_id}
  attribute: current_position
  internal: true
  filters:
  - filter_out: nan
  on_value:
  - lambda: |-
      id(${uid}_current_position) = ${invert_position | default("false")} ? (100.0f - x) : x;
  - script.execute: ${uid}_sync_state

script:
# ── Abstract action scripts — REMOTE implementation ───────────────────────────
- id: ${uid}_cover_open
  then:
  - homeassistant.action:
      action: cover.open_cover
      data:
        entity_id: ${entity_id}

- id: ${uid}_cover_close
  then:
  - homeassistant.action:
      action: cover.close_cover
      data:
        entity_id: ${entity_id}

- id: ${uid}_cover_stop
  then:
  - homeassistant.action:
      action: cover.stop_cover
      data:
        entity_id: ${entity_id}

# My-position target is a script/scene/button, not a cover — its domain is
# auto-detected to pick the right HA service.
- id: ${uid}_cover_my
  then:
  - homeassistant.action:
      action: !lambda |-
        std::string target = "${my_position_target | default(entity_id)}";
        std::string domain = target.substr(0, target.find('.'));
        if (domain == "switch")       return std::string("switch.turn_on");
        if (domain == "script")       return std::string("script.turn_on");
        if (domain == "button")       return std::string("button.press");
        if (domain == "scene")        return std::string("scene.turn_on");
        if (domain == "input_button") return std::string("input_button.press");
        if (domain == "cover")        return std::string("cover.toggle");
        return std::string("script.turn_on");
      data:
        entity_id: "${my_position_target | default(entity_id)}"

- id: ${uid}_cover_set_position
  then:
  - homeassistant.action:
      action: cover.set_cover_position
      data:
        entity_id: ${entity_id}
        # De-normalize back to the device's native convention before sending.
        position: !lambda |-
          float p = id(${uid}_current_position);
          return (int) (${invert_position | default("false")} ? (100.0f - p) : p);

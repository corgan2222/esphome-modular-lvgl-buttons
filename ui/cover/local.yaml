---
# Local cover tile — controls an ESPHome cover component (rolling shutter,
# garage door, gate, ...) directly via native cover.* actions.
# "Statefull" (position-reporting) vs "stateless" is auto-detected from the
# component's traits (get_supports_position()). Short-click opens the detail
# page (up / stop / down / optional my-position).
#
# Unlike the remote variant, local drives a single ESPHome cover component —
# there's no notion of independent accessory entities, since the component
# itself is the single source of truth for open/close/stop.
#
# vars:
#   uid:                unique identifier
#   entity_id:          ESPHome cover component ID (must be declared earlier)
#   row, column:        grid placement
#   text:                tile label
#   icon:               icon glyph (e.g. $mdi_window_shutter)
#   row_span, column_span: (default 1)
#   page_id:            parent page (default main_page)
#   my_position_target: optional ESPHome script ID to run for the
#                        "my position" preset button. Omit to hide the button.

packages:
  ${uid}_detail: !include
    file: detail.yaml
    vars:
      uid: ${uid}
      text: ${text}
      page_id: ${page_id | default("main_page")}
      has_my: '${"true" if (my_position_target | default(uid ~ "_my_noop")) != (uid ~ "_my_noop") else "false"}'

lvgl:
  pages:
  - id: !extend ${page_id | default("main_page")}
    widgets:
    - container:
        id: ${uid}_tile
        grid_cell_row_pos: ${row}
        grid_cell_column_pos: ${column}
        grid_cell_row_span: ${row_span | default(1)}
        grid_cell_column_span: ${column_span | default(1)}
        grid_cell_x_align: stretch
        grid_cell_y_align: stretch
        widgets:
        - button:
            id: button_${uid}
            widgets:
            - label:
                id: icon_${uid}
                text_font: $icon_font
                align: top_left
                text: ${icon}
            - label:
                id: label_${uid}
                align: bottom_left
                long_mode: wrap
                width: 100%
                text: ${text}
            - label:
                id: state_${uid}
                align: top_right
                text_font: $text_font
                text_color: $label_on_color
                text: "--"
            on_short_click:
              then:
              - lvgl.page.show:
                  id: ${uid}_cover_page
                  animation: MOVE_LEFT
                  time: 300ms

# ── Sync state whenever the cover's operation changes ──────────────────────────
cover:
- id: !extend ${entity_id}
  on_opening:
  - script.execute: ${uid}_local_sync
  on_closing:
  - script.execute: ${uid}_local_sync
  on_idle:
  - script.execute: ${uid}_local_sync
  on_opened:
  - script.execute: ${uid}_local_sync
  on_closed:
  - script.execute: ${uid}_local_sync

esphome:
  on_boot:
  - priority: -250
    then:
    - script.execute: ${uid}_local_sync

script:
# ── Detect capabilities + push component state → globals ──────────────────────
- id: ${uid}_local_sync
  then:
  - lambda: |-
      esphome::cover::Cover *c = id(${entity_id});
      auto traits = c->get_traits();
      id(${uid}_is_statefull) = traits.get_supports_position();
      if (id(${uid}_is_statefull)) {
        id(${uid}_current_position) = c->position * 100.0f;
      } else {
        id(${uid}_current_position) = (c->position > 0.0f) ? 100.0f : 0.0f;
      }
      switch (c->current_operation) {
        case esphome::cover::COVER_OPERATION_OPENING: id(${uid}_operation) = 1; break;
        case esphome::cover::COVER_OPERATION_CLOSING: id(${uid}_operation) = 2; break;
        default:                                       id(${uid}_operation) = 0; break;
      }
  - script.execute: ${uid}_update_visibility
  - script.execute: ${uid}_sync_state

# Always-present no-op target for the my-position script when unconfigured.
- id: ${uid}_my_noop
  then: []

# ── Abstract action scripts — LOCAL implementation ─────────────────────────────
- id: ${uid}_cover_open
  then:
  - cover.open: ${entity_id}

- id: ${uid}_cover_close
  then:
  - cover.close: ${entity_id}

- id: ${uid}_cover_stop
  then:
  - cover.stop: ${entity_id}

- id: ${uid}_cover_set_position
  then:
  - cover.control:
      id: ${entity_id}
      position: !lambda return id(${uid}_current_position) / 100.0f;

- id: ${uid}_cover_my
  then:
  - script.execute: ${my_position_target | default(uid ~ "_my_noop")}

# layout_modern_320x480.yaml — page-1 "Modern Dark" look for 320x480 portrait
# (Guition ESP32 JC8048W535, rotation 0). Pixel-exact variant of the 480x800
# layout_modern.yaml — NOT responsive. Proportional scale from the 480-base:
# x/width x0.6667 (320/480), y/height x0.60 (480/800). Fonts snap down a tier to
# match (72->42, 48->24, 42->24, 36->20, 24->14, everything else floors at the
# nunito_12 minimum). Full card set is kept; the only deliberate deviation from a
# strict scale is the burn card's 2nd column x (nudged left to 72 so the "30 min"
# unit clears the narrower 139px card instead of clipping). Reads the same
# backend compute IDs + own HA sensors. Selected by `design: modern_320x480`.
#
# CREATURE PLACEMENT: identical pattern to layout_modern.yaml — this file OWNS
# the creature root (`clawd_c_creature_root`) as a CENTER child inside the GIF
# frame and replicates creature.yaml's on_boot clawd_init() + the HA session-%
# sensor that feeds clawd_set_usage(). creature.yaml is NOT re-included; no
# original repo file is modified.

# --- own HA-derived percentage sensors (mirror stats_panel's pattern) ---
sensor:
  # Feeds the creature animation engine (was provided by creature.yaml).
  - platform: homeassistant
    id: clawd_c_anim_session_pct
    entity_id: ${ha_session_usage}
    internal: true
    on_value:
      then:
        - lambda: 'clawd_set_usage(x, 0, 0.0f, 0);'
  # Drive the modern hero/cards (consumed by clawd_m_refresh).
  - platform: homeassistant
    id: clawd_m_session_pct
    entity_id: ${ha_session_usage}
    internal: true
  - platform: homeassistant
    id: clawd_m_weekly_pct
    entity_id: ${ha_week_usage}
    internal: true
  - platform: homeassistant
    id: clawd_m_extra_pct
    entity_id: ${ha_extra_usage}
    internal: true
  - platform: homeassistant
    id: clawd_m_extra_credits
    entity_id: ${ha_extra_credits}
    internal: true

# --- boot the creature canvas (was provided by creature.yaml) ---
esphome:
  on_boot:
    - priority: -100   # after LVGL + display are up
      then:
        - lambda: |-
            clawd_init(id(clawd_c_creature_root), ${screen_width}, ${screen_height});

lvgl:
  pages:
    - id: !extend main_page
      bg_color: black
      bg_opa: COVER
      pad_all: 0
      widgets:
        # Full-page wrapper: fills the base 4x4 grid (cell 0,0 spanning all),
        # carries NO inner layout, so everything inside positions absolutely
        # relative to the page (x/y + TOP_RIGHT against the page edges).
        - obj:
            id: clawd_m_root
            grid_cell_row_pos: 0
            grid_cell_column_pos: 0
            grid_cell_row_span: 4
            grid_cell_column_span: 4
            grid_cell_x_align: stretch
            grid_cell_y_align: stretch
            bg_color: black
            bg_opa: COVER
            border_width: 0
            pad_all: 0
            radius: 0
            widgets:
              # ===== GIF frame (top third) — holds the creature animation =====
              - obj:
                  id: clawd_m_gif_frame
                  x: 40
                  y: 17
                  width: 240
                  height: 150
                  radius: 9
                  border_width: 2
                  border_color: slate_blue_gray
                  bg_color: black
                  bg_opa: COVER
                  pad_all: 0
                  widgets:
                    # Engine draws the creature into this box (clawd_init above).
                    - obj:
                        id: clawd_c_creature_root
                        align: CENTER
                        width: 100%
                        height: 100%
                        bg_opa: TRANSP
                        border_width: 0
                        pad_all: 0
              # ===== Session hero =====
              - label:
                  id: clawd_m_hero_title
                  text: ${t_modern_session | default("Session")}
                  x: 16
                  y: 191
                  text_font: nunito_12
                  text_color: white
              - label:
                  id: clawd_m_session_reset
                  text: ""
                  align: TOP_RIGHT
                  x: -16
                  y: 192
                  text_font: nunito_12
                  text_color: misty_blue
              - label:
                  id: clawd_m_session_num
                  text: "0"
                  x: 15
                  y: 198
                  text_font: nunito_42
                  text_color: ep_orange
              - label:
                  id: clawd_m_session_pct_sign
                  text: "%"
                  x: 67
                  y: 220
                  text_font: nunito_20
                  text_color: ep_orange
              - label:
                  id: clawd_m_session_min
                  text: "0"
                  align: TOP_RIGHT
                  x: -44
                  y: 210
                  text_font: nunito_24
                  text_color: white
              - label:
                  id: clawd_m_session_unit
                  text: ${t_modern_min | default("min")}
                  align: TOP_RIGHT
                  x: -16
                  y: 223
                  text_font: nunito_12
                  text_color: misty_blue
              - bar:
                  id: clawd_m_session_bar
                  x: 16
                  y: 247
                  width: 288
                  height: 11
                  min_value: 0
                  max_value: 100
                  value: 0
                  radius: 6
                  bg_color: gray900
                  bg_opa: COVER
                  indicator:
                    bg_color: ep_orange
                    bg_opa: COVER
                    radius: 6
              # ===== Time-till-100% card =====
              - obj:
                  id: clawd_m_card_till
                  x: 16
                  y: 270
                  width: 288
                  height: 60
                  radius: 11
                  border_width: 0
                  bg_color: slate_blue_gray
                  bg_opa: COVER
                  pad_all: 0
                  widgets:
                    - label:
                        id: clawd_m_till_title
                        text: ${t_modern_till | default("Time till 100%")}
                        x: 12
                        y: 10
                        text_font: nunito_12
                        text_color: amber
                    - label:
                        id: clawd_m_till_eta
                        text: ""
                        x: 12
                        y: 24
                        text_font: nunito_12
                        text_color: misty_blue
                    - label:
                        id: clawd_m_till_num
                        text: "0"
                        align: TOP_RIGHT
                        x: -47
                        y: 8
                        text_font: nunito_24
                        text_color: amber
                    - label:
                        id: clawd_m_till_unit
                        text: ${t_modern_min | default("min")}
                        align: TOP_RIGHT
                        x: -15
                        y: 20
                        text_font: nunito_12
                        text_color: amber
                    - bar:
                        id: clawd_m_till_bar
                        x: 12
                        y: 44
                        width: 264
                        height: 7
                        min_value: 0
                        max_value: 100
                        value: 0
                        radius: 4
                        bg_color: gray900
                        bg_opa: COVER
                        indicator:
                          bg_color: amber
                          bg_opa: COVER
                          radius: 4
              # ===== Burn-rate card (5m + 30m) =====
              - obj:
                  id: clawd_m_card_burn
                  x: 16
                  y: 337
                  width: 139
                  height: 58
                  radius: 11
                  border_width: 0
                  bg_color: slate_blue_gray
                  bg_opa: COVER
                  pad_all: 0
                  widgets:
                    - label:
                        text: ${t_modern_burn | default("Burn Rate")}
                        x: 11
                        y: 8
                        text_font: nunito_12
                        text_color: white
                    - label:
                        id: clawd_m_burn5
                        text: "0"
                        x: 11
                        y: 22
                        text_font: nunito_14
                        text_color: white
                    - label:
                        text: ${t_modern_burn5_unit | default("%/h  5 min")}
                        x: 11
                        y: 40
                        text_font: nunito_12
                        text_color: misty_blue
                    - label:
                        id: clawd_m_burn30
                        text: "0"
                        x: 72
                        y: 22
                        text_font: nunito_14
                        text_color: white
                    - label:
                        text: ${t_modern_burn30_unit | default("%/h  30 min")}
                        x: 72
                        y: 40
                        text_font: nunito_12
                        text_color: misty_blue
              # ===== Weekly-pace card: replaces the burn card in weekly mode =====
              # Same box as the burn card, hidden until the refresh script sees
              # weekly mode (in weekly mode the burn rate is almost always 0).
              - obj:
                  id: clawd_m_card_pace
                  x: 16
                  y: 337
                  width: 139
                  height: 58
                  radius: 11
                  border_width: 0
                  bg_color: slate_blue_gray
                  bg_opa: COVER
                  pad_all: 0
                  hidden: true
                  widgets:
                    - label:
                        text: ${t_modern_pace | default("Weekly pace")}
                        x: 11
                        y: 8
                        text_font: nunito_12
                        text_color: white
                    - label:
                        id: clawd_m_pace_num
                        text: "--"
                        x: 11
                        y: 22
                        text_font: nunito_14
                        text_color: ep_green
                    - label:
                        id: clawd_m_pace_note
                        text: ""
                        x: 72
                        y: 22
                        text_font: nunito_12
                        text_color: misty_blue
              # ===== Will-hit-limit card (runway verdict) =====
              - obj:
                  id: clawd_m_card_hit
                  x: 165
                  y: 337
                  width: 139
                  height: 58
                  radius: 11
                  border_width: 2
                  border_color: ep_green
                  bg_color: black
                  bg_opa: COVER
                  pad_all: 0
                  widgets:
                    # Header carries the Yes/No verdict appended at runtime
                    # ("Will hit limit - No"); detail line below shows the
                    # "Xm to spare / Xm early" part. Both default GREEN; the
                    # refresh script repaints them + the border RED only when
                    # the runway pace ratio says the limit WILL be hit (>1).
                    - label:
                        id: clawd_m_hit_label
                        text: ${t_modern_hit | default("Will hit limit")}
                        x: 11
                        y: 10
                        text_font: nunito_12
                        text_color: ep_green
                    - label:
                        id: clawd_m_hit_num
                        text: ""
                        x: 11
                        y: 30
                        text_font: nunito_12
                        text_color: ep_green
              # ===== Weekly card =====
              - obj:
                  id: clawd_m_card_weekly
                  x: 16
                  y: 402
                  width: 139
                  height: 70
                  radius: 11
                  border_width: 0
                  bg_color: slate_blue_gray
                  bg_opa: COVER
                  pad_all: 0
                  widgets:
                    - label:
                        id: clawd_m_weekly_title
                        text: ${t_modern_weekly | default("Weekly")}
                        x: 11
                        y: 8
                        text_font: nunito_12
                        text_color: white
                    - label:
                        id: clawd_m_weekly_reset
                        text: ""
                        align: TOP_RIGHT
                        x: -11
                        y: 8
                        text_font: nunito_12
                        text_color: misty_blue
                    - label:
                        id: clawd_m_weekly_num
                        text: "0%"
                        x: 11
                        y: 23
                        text_font: nunito_24
                        text_color: ep_green
                    - bar:
                        id: clawd_m_weekly_bar
                        x: 11
                        y: 58
                        width: 117
                        height: 6
                        min_value: 0
                        max_value: 100
                        value: 0
                        radius: 3
                        bg_color: gray900
                        bg_opa: COVER
                        indicator:
                          bg_color: ep_green
                          bg_opa: COVER
                          radius: 3
              # ===== Extra card =====
              # NOTE: the credits label is `clawd_m_extra_cr`, NOT
              # clawd_m_extra_credits — that id is already taken by the HA
              # credits SENSOR above (ESPHome forbids duplicate IDs). The
              # refresh script writes this label from that sensor's state.
              - obj:
                  id: clawd_m_card_extra
                  x: 165
                  y: 402
                  width: 139
                  height: 70
                  radius: 11
                  border_width: 0
                  bg_color: slate_blue_gray
                  bg_opa: COVER
                  pad_all: 0
                  widgets:
                    - label:
                        text: ${t_modern_extra | default("Extra")}
                        x: 11
                        y: 8
                        text_font: nunito_12
                        text_color: white
                    - label:
                        id: clawd_m_extra_cr
                        text: ""
                        align: TOP_RIGHT
                        x: -11
                        y: 8
                        text_font: nunito_12
                        text_color: misty_blue
                    - label:
                        id: clawd_m_extra_num
                        text: "0%"
                        x: 11
                        y: 23
                        text_font: nunito_24
                        text_color: crimson
                    - bar:
                        id: clawd_m_extra_bar
                        x: 11
                        y: 58
                        width: 117
                        height: 6
                        min_value: 0
                        max_value: 100
                        value: 0
                        radius: 3
                        bg_color: gray900
                        bg_opa: COVER
                        indicator:
                          bg_color: crimson
                          bg_opa: COVER
                          radius: 3

# --- refresh: push backend compute IDs + own HA sensors into the widgets ---
# Top-level (merges with the device config's other script:/interval: blocks).
# Every read is has_state()-guarded so pre-warmup widgets show their default.
script:
  - id: clawd_m_refresh
    then:
      - lvgl.label.update:
          id: clawd_m_session_num
          text: !lambda 'return id(clawd_m_session_pct).has_state() ? to_string((int) id(clawd_m_session_pct).state) : std::string("0");'
      # Re-anchor the "%" sign just right of the session number's MEASURED width
      # so it hugs the digits whether usage is 1, 2 or 3 digits (a fixed x would
      # gap on "8" and overlap on "100"). 15 = the number's left x; +3 px lede
      # (both x0.6667 of the 480-base's 22 + 4).
      - lambda: |-
          lv_obj_t *num = id(clawd_m_session_num);
          lv_obj_update_layout(num);
          lv_obj_set_x(id(clawd_m_session_pct_sign), 15 + lv_obj_get_width(num) + 3);
      - lvgl.bar.update:
          id: clawd_m_session_bar
          value: !lambda 'return (id(clawd_m_session_pct).has_state() && !std::isnan(id(clawd_m_session_pct).state)) ? (int) id(clawd_m_session_pct).state : 0;'
      # Weekly mode (plan without a five-hour window, clawd_weekly_mode()): the hero
      # is the week and the time card counts to the weekly limit.
      - lvgl.label.update:
          id: clawd_m_hero_title
          text: !lambda 'return std::string(clawd_weekly_mode() ? "${t_modern_week | default("Week")}" : "${t_modern_session | default("Session")}");'
      # Durations: "45" min / "20h" 39m / "8d" 08h — big part in the number label,
      # rest in the unit label (clawd_fmt_duration in clawdmeter_engine.h).
      - lvgl.label.update:
          id: clawd_m_session_min
          text: !lambda |-
            if (!id(clawd_reset_reset_in_min).has_state() || std::isnan(id(clawd_reset_reset_in_min).state)) return std::string("0");
            char big[12], small[12];
            clawd_fmt_duration((int) id(clawd_reset_reset_in_min).state, "${t_modern_min | default("min")}", big, sizeof(big), small, sizeof(small));
            return std::string(big);
      - lvgl.label.update:
          id: clawd_m_session_unit
          text: !lambda |-
            if (!id(clawd_reset_reset_in_min).has_state() || std::isnan(id(clawd_reset_reset_in_min).state)) return std::string("${t_modern_min | default("min")}");
            char big[12], small[12];
            clawd_fmt_duration((int) id(clawd_reset_reset_in_min).state, "${t_modern_min | default("min")}", big, sizeof(big), small, sizeof(small));
            return std::string(small);
      # "Reset 08:00"; more than a day away the weekday goes in front ("Reset Wed 08:00").
      - lvgl.label.update:
          id: clawd_m_session_reset
          text: !lambda |-
            if (!id(clawd_reset_reset_clock).has_state()) return std::string("");
            std::string when = id(clawd_reset_reset_clock).state;
            if (id(clawd_reset_reset_in_min).has_state() && id(clawd_reset_reset_in_min).state >= 1440 &&
                id(clawd_reset_reset_epoch) != 0) {
              ESPTime t = ESPTime::from_epoch_local((time_t) id(clawd_reset_reset_epoch));
              std::string days = "${t_weekdays | default("Sun,Mon,Tue,Wed,Thu,Fri,Sat")}";
              int want = t.day_of_week - 1;  // ESPTime: 1 = Sunday
              size_t start = 0;
              for (int i = 0; i < want && start != std::string::npos; i++) {
                start = days.find(',', start);
                if (start != std::string::npos) start++;
              }
              if (start != std::string::npos) {
                size_t end = days.find(',', start);
                when = days.substr(start, end == std::string::npos ? std::string::npos : end - start) + " " + when;
              }
            }
            char b[40];
            snprintf(b, sizeof(b), "${t_modern_reset_fmt | default("Reset %s")}", when.c_str());
            return std::string(b);
      - lvgl.label.update:
          id: clawd_m_till_title
          text: !lambda 'return std::string(clawd_weekly_mode() ? "${t_modern_till_week | default("Till weekly limit")}" : "${t_modern_till | default("Time till 100%")}");'
      - lvgl.label.update:
          id: clawd_m_till_num
          # clawd_ttl_time_to_100 is a text_sensor ("in 45 min" / localized / "unknown").
          # Pull the first integer run out of it — single source of truth, no formula
          # duplication, locale-robust (every t_ttl_mins variant embeds the %d digits).
          text: !lambda |-
            if (!id(clawd_ttl_time_to_100).has_state()) return std::string("0");
            int m = clawd_first_int(id(clawd_ttl_time_to_100).state.c_str());
            if (m < 0) return std::string("--");
            char big[12], small[12];
            clawd_fmt_duration(m, "${t_modern_min | default("min")}", big, sizeof(big), small, sizeof(small));
            return std::string(big);
      - lvgl.label.update:
          id: clawd_m_till_unit
          text: !lambda |-
            int m = id(clawd_ttl_time_to_100).has_state() ? clawd_first_int(id(clawd_ttl_time_to_100).state.c_str()) : -1;
            if (m < 0) return std::string("${t_modern_min | default("min")}");
            char big[12], small[12];
            clawd_fmt_duration(m, "${t_modern_min | default("min")}", big, sizeof(big), small, sizeof(small));
            return std::string(small);
      # Keep each big number next to its small unit: with "min" the number stays
      # where the layout draws it, with "53m" / "03h" it moves up to the unit.
      # Numbers: number x, unit x (both TOP_RIGHT offsets), gap in px.
      - lambda: |-
          clawd_hug_unit(id(clawd_m_session_min), id(clawd_m_session_unit), -44, -16, "${t_modern_min | default("min")}", 4);
          clawd_hug_unit(id(clawd_m_till_num), id(clawd_m_till_unit), -47, -15, "${t_modern_min | default("min")}", 4);
      - lvgl.bar.update:
          id: clawd_m_till_bar
          value: !lambda 'return (id(clawd_m_session_pct).has_state() && !std::isnan(id(clawd_m_session_pct).state)) ? (int) id(clawd_m_session_pct).state : 0;'
      - lvgl.label.update:
          id: clawd_m_till_eta
          text: !lambda |-
            if (!id(clawd_ttl_eta_clock).has_state()) return std::string("");
            char b[28];
            snprintf(b, sizeof(b), "${t_modern_eta_fmt | default("ETA %s")}", id(clawd_ttl_eta_clock).state.c_str());
            return std::string(b);
      - lvgl.label.update:
          id: clawd_m_burn5
          text: !lambda 'return id(clawd_burn5_rate).has_state() ? to_string((int) id(clawd_burn5_rate).state) : std::string("0");'
      - lvgl.label.update:
          id: clawd_m_burn30
          text: !lambda 'return id(clawd_burn30_rate).has_state() ? to_string((int) id(clawd_burn30_rate).state) : std::string("0");'
      # Weekly mode: the pace card ("-43%  under plan") takes the burn card's place.
      - if:
          condition:
            lambda: 'return clawd_weekly_mode();'
          then:
            - lvgl.widget.hide: clawd_m_card_burn
            - lvgl.widget.show: clawd_m_card_pace
            - lvgl.label.update:
                id: clawd_m_pace_num
                text: !lambda |-
                  if (!id(clawd_week_pace).has_state() || std::isnan(id(clawd_week_pace).state)) return std::string("--");
                  char b[12];
                  snprintf(b, sizeof(b), "%+d%%", (int) std::lround(id(clawd_week_pace).state));
                  return std::string(b);
            # Ahead of an even spread over the week (> 0) = red, else green.
            - if:
                condition:
                  lambda: 'return id(clawd_week_pace).has_state() && id(clawd_week_pace).state > 0.0f;'
                then:
                  - lvgl.label.update:
                      id: clawd_m_pace_num
                      text_color: crimson
                else:
                  - lvgl.label.update:
                      id: clawd_m_pace_num
                      text_color: ep_green
            - lvgl.label.update:
                id: clawd_m_pace_note
                text: !lambda |-
                  if (!id(clawd_week_pace).has_state() || std::isnan(id(clawd_week_pace).state)) return std::string("");
                  return std::string(id(clawd_week_pace).state > 0.0f ? "${t_modern_pace_over | default("over plan")}" : "${t_modern_pace_under | default("under plan")}");
          else:
            - lvgl.widget.hide: clawd_m_card_pace
            - lvgl.widget.show: clawd_m_card_burn
      # "Will hit limit" header gets the verdict word appended ("- No"/"- Yes"),
      # parsed out of the runway text sensor (text before the middle dot ·).
      - lvgl.label.update:
          id: clawd_m_hit_label
          text: !lambda |-
            std::string base = "${t_modern_hit | default("Will hit limit")}";
            if (!id(clawd_rw_runway).has_state()) return base;
            std::string s = id(clawd_rw_runway).state;
            if (s == "${t_runway_unknown | default("unknown")}") return base;
            std::string verdict = s;
            size_t p = s.find("\xC2\xB7");
            if (p != std::string::npos) verdict = s.substr(0, p);
            while (!verdict.empty() && verdict.back() == ' ') verdict.pop_back();
            if (verdict.empty()) return base;
            return base + " - " + verdict;
      # Detail line = the "Xm to spare" / "Xm early" part (after the dot), if any.
      - lvgl.label.update:
          id: clawd_m_hit_num
          text: !lambda |-
            if (!id(clawd_rw_runway).has_state()) return std::string("");
            std::string s = id(clawd_rw_runway).state;
            size_t p = s.find("\xC2\xB7");
            if (p == std::string::npos) return std::string("");
            std::string detail = s.substr(p + 2);
            while (!detail.empty() && detail.front() == ' ') detail.erase(detail.begin());
            return detail;
      # Color: GREEN by default, RED only when the pace ratio (T_reset/T_limit)
      # exceeds 1 — i.e. usage would hit the limit BEFORE the reset.
      - if:
          condition:
            lambda: 'return id(clawd_rw_runway_ratio).has_state() && id(clawd_rw_runway_ratio).state > 1.0f;'
          then:
            - lvgl.obj.update:
                id: clawd_m_card_hit
                border_color: crimson
            - lvgl.label.update:
                id: clawd_m_hit_label
                text_color: crimson
            - lvgl.label.update:
                id: clawd_m_hit_num
                text_color: crimson
          else:
            - lvgl.obj.update:
                id: clawd_m_card_hit
                border_color: ep_green
            - lvgl.label.update:
                id: clawd_m_hit_label
                text_color: ep_green
            - lvgl.label.update:
                id: clawd_m_hit_num
                text_color: ep_green
      # Weekly card: in weekly mode the hero already shows the week, so this card
      # shows the busiest model's own weekly cap instead ("Fable  max 50%  7%").
      - if:
          condition:
            lambda: 'return clawd_weekly_mode();'
          then:
            - lvgl.label.update:
                id: clawd_m_weekly_title
                text: !lambda 'return (id(clawd_model_name).has_state() && !id(clawd_model_name).state.empty()) ? id(clawd_model_name).state : std::string("${t_modern_model | default("Model")}");'
            - lvgl.label.update:
                id: clawd_m_weekly_num
                text: !lambda 'return (id(clawd_model_pct).has_state() && !std::isnan(id(clawd_model_pct).state)) ? (to_string((int) id(clawd_model_pct).state) + "%") : std::string("--");'
            - lvgl.bar.update:
                id: clawd_m_weekly_bar
                value: !lambda 'return (id(clawd_model_pct).has_state() && !std::isnan(id(clawd_model_pct).state)) ? (int) id(clawd_model_pct).state : 0;'
            - lvgl.label.update:
                id: clawd_m_weekly_reset
                text: !lambda |-
                  if (!id(clawd_model_allow).has_state() || std::isnan(id(clawd_model_allow).state)) return std::string("");
                  char b[24];
                  snprintf(b, sizeof(b), "${t_modern_model_cap | default("max %d%%")}", (int) id(clawd_model_allow).state);
                  return std::string(b);
          else:
            - lvgl.label.update:
                id: clawd_m_weekly_title
                text: ${t_modern_weekly | default("Weekly")}
            - lvgl.label.update:
                id: clawd_m_weekly_num
                text: !lambda 'return id(clawd_m_weekly_pct).has_state() ? (to_string((int) id(clawd_m_weekly_pct).state) + "%") : std::string("0%");'
            - lvgl.bar.update:
                id: clawd_m_weekly_bar
                value: !lambda 'return (id(clawd_m_weekly_pct).has_state() && !std::isnan(id(clawd_m_weekly_pct).state)) ? (int) id(clawd_m_weekly_pct).state : 0;'
            - lvgl.label.update:
                id: clawd_m_weekly_reset
                text: !lambda 'return id(clawd_wreset_reset_clock).has_state() ? id(clawd_wreset_reset_clock).state : std::string("");'
      - lvgl.label.update:
          id: clawd_m_extra_num
          text: !lambda 'return id(clawd_m_extra_pct).has_state() ? (to_string((int) id(clawd_m_extra_pct).state) + "%") : std::string("0%");'
      - lvgl.bar.update:
          id: clawd_m_extra_bar
          value: !lambda 'return (id(clawd_m_extra_pct).has_state() && !std::isnan(id(clawd_m_extra_pct).state)) ? (int) id(clawd_m_extra_pct).state : 0;'
      - lvgl.label.update:
          id: clawd_m_extra_cr
          text: !lambda |-
            if (!id(clawd_m_extra_credits).has_state()) return std::string("");
            char b[16];
            snprintf(b, sizeof(b), "${t_modern_credits_fmt | default("%.1f cr")}", id(clawd_m_extra_credits).state);
            return std::string(b);

interval:
  - interval: 3s
    then:
      - script.execute: clawd_m_refresh
